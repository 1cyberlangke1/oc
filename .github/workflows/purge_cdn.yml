name: Auto Purge jsDelivr CDN Cache

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'character/**'
      - 'README.md'
      - '.github/**'
  workflow_dispatch:

jobs:
  purge-cdn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Purge jsDelivr CDN Cache
        run: python .github/scripts/purge_cdn.py
